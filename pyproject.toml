[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iep-medalla-leads-api"
version = "0.1.0"
description = "API de formularios de admision y contacto de I.E.P. Medalla"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "email-validator>=2.1,<3",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.5,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/email/*.html", "config/*.json"]
